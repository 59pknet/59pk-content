# 每天自动从 www.59pk.net 拉取文章，生成 Markdown 后提交到本仓库。
# 目录约定：wp-export.py 在仓库根目录；产出 articles/ 与 data/posts.json。

name: Sync from WordPress

on:
  schedule:
    # UTC 02:00 = 北京时间 10:00，每天自动同步
    - cron: '0 15 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动点触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装可选的高质量转换器
        run: pip install markdownify

      - name: 从主站拉取并导出文章
        run: |
          python wp-export.py \
            --site "https://www.59pk.net" \
            --out . \
            --per-page 100

      - name: 提交变更
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "content: 自动同步 $(date -u +%Y-%m-%d)"
            git push
          fi
